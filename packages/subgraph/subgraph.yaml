# Prepared for Base; subgraph not published. New deployments: ../../deployments/base.json.
# Creation tx: 0x78301d0cffc614a1ad591275a96fbdd413fddb73568d57fe6bda3a37e4055266
specVersion: 1.0.0
description: Nota public purchase evidence; redemption is deployment-scoped, not authorization.
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum/contract
    name: NotaReceiptStore
    network: base
    source:
      address: "0xf6062F3F52D3E19cb9cc3e027491a5c11D101F88"
      abi: NotaReceiptStore
      startBlock: 50536305
    context:
      chainId:
        type: BigInt
        data: "8453"
      registry:
        type: Bytes
        data: "0x9AaFfA5787ca332a40B9C98E3e5323A97F96D991"
      store:
        type: Bytes
        data: "0xf6062F3F52D3E19cb9cc3e027491a5c11D101F88"
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities: [Purchase, Listing, Settlement]
      abis:
        - name: NotaReceiptStore
          file: ./abis/NotaReceiptStore.json
      eventHandlers:
        - event: ReceiptPurchasedV2(uint256,indexed address,indexed address,uint256,indexed bytes32,uint256,bytes32,bytes32)
          handler: handleReceiptPurchasedV2
