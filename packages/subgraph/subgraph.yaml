        type: Bytes
        data: "0x9AaFfA5787ca332a40B9C98E3e5323A97F96D991"
      store:
        type: Bytes
        data: "0xf6062F3F52D3E19cb9cc3e027491a5c11D101F88"
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities: [Purchase, Listing, Settlement]
      abis:
        - name: NotaX402Settlement
          file: ./abis/NotaX402Settlement.json
      eventHandlers:
        - event: X402ReceiptSettled(indexed uint256,indexed address,indexed address,uint256,bytes32,uint256,bytes32,bytes32,bytes32)
